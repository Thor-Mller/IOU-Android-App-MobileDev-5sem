
# User table is keyed by Firebase Auth UID.
type User @table {
  id: String! @default(expr: "auth.uid")
  username: String! @unique @col(dataType: "varchar(50)")
  phone: String @unique @col(dataType: "varchar(50)")
  email: String! @unique @col(dataType: "varchar(50)")
  totalMissing: Float! @col(dataType: "numeric(10, 2)")
  totalDebt: Float! @col(dataType: "numeric(10, 2)")
}

type Expense @table {
  user: User!
  name: String! @col(dataType: "varchar(50)")
  amount: Float! @col(dataType: "numeric(10, 2)")
  payed: Float! @col(dataType: "numeric(10, 2)") @default(value: 0.0)
  group: Group!
}

type ExpenseProvider @table(key: ["expense", "user"]) {
  expense: Expense!
  user: User!
  shareAmount: Float @col(dataType: "numeric(10, 2)")
}

type Group @table {
  name: String! @col(dataType: "varchar(50)")
  creator: User!
}

type GroupUser @table(key: ["group", "user"]) {
  group: Group!
  user: User!
}

