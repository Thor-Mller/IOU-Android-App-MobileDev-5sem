
# User table is keyed by Firebase Auth UID.
type User @table {
  id: String! @default(expr: "auth.uid")
  username: String! @col(dataType: "varchar(50)")
  phone: String! @col(dataType: "varchar(50)")
  totalMissing: Float! @col(dataType: "numeric(10, 2)")
  totalDebt: Float! @col(dataType: "numeric(10, 2)")
}

type Expense @table {
  user: User!
  name: String! @col(dataType: "varchar(50)")
  amount: Float! @col(dataType: "numeric(10, 2)")
}

type ExpenseProviders @table(key: ["expense", "user"]) {
  expense: Expense!
  user: User!
  shareAmount: Float @col(dataType: "numeric(10, 2)")
}