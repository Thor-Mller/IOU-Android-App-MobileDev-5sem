# User table is keyed by Firebase Auth UID.
type User @table {
  id: String! @default(expr: "auth.uid")
  username: String! @unique @col(dataType: "varchar(50)")
  phone: String @unique @col(dataType: "varchar(50)")
  email: String! @unique @col(dataType: "varchar(50)")
    totalMissing: Int! @col(dataType: "bigint")
    totalDebt: Int! @col(dataType: "bigint")
}

type Expense @table {
  user: User!
  name: String! @col(dataType: "varchar(50)")
    amount: Int! @col(dataType: "bigint")
    payed: Int! @col(dataType: "bigint") @default(value: 0)
  group: Group!
}

type ExpenseProvider @table(key: ["expense", "user"]) {
  expense: Expense!
  user: User!
    shareAmount: Int @col(dataType: "bigint")
}

type Group @table {
  name: String! @col(dataType: "varchar(50)")
  creator: User!
}

type GroupUser @table(key: ["group", "user"]) {
  group: Group!
  user: User!
}