# 1. Get the logged-in user's profile, expenses they paid for, and debts they owe
query GetMyProfileAndExpenses @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    username
    phone
    email
    totalMissing
    totalDebt

    # Expenses THIS user created (money owed TO them)
    expenses_on_user {
      id
      name
      amount
      expenseProviders_on_expense {
        shareAmount
        user {
          id
          username
        }
      }
    }

    # Expenses OTHER users created where THIS user owes a share
    expenseProviders_on_user {
      shareAmount
      expense {
        id
        name
        amount
        user {
          id
          username
        }
      }
    }
  }
}

# 2. List all users so the user can pick friends to split an expense with
query ListUsers @auth(level: USER, insecureReason: "Authenticated users can browse users to split expenses with") {
  users {
    id
    username
    phone
    email
  }
}

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    username
    phone
    email
    totalMissing
    totalDebt
  }
}

# 3. Search for a user by username or phone number
query FindUser($search: String!) @auth(level: USER, insecureReason: "Authenticated users can search for users by username or phone") {
  users(
    where: {
      _or: [
        { username: { contains: $search } }
        { phone: { eq: $search } }
        { email: {contains: $search }}
      ]
    }
  ) {
    id
    username
    phone
    email
  }
}

# 4. Get full details for one specific expense
query GetExpenseById($expenseId: UUID!) @auth(level: USER, insecureReason: "Authenticated users can view details of shared expenses") {
  expense(key: { id: $expenseId }) {
    id
    name
    amount
    user {
      id
      username
    }
    expenseProviders_on_expense {
      shareAmount
      user {
        id
        username
        phone
        email
      }
    }
  }
}

query GetUsersInGroup($groupId: UUID!) @auth(level: USER) {
  groupUsers(where: { groupId: { eq: $groupId } }) {
    user {
      id
      username
      email
      phone
      totalMissing
      totalDebt
    }
  }
}

query SearchUsersInGroup(
  $groupId: UUID!
  $search: String!
) @auth(level: USER) {
  groupUsers(
    where: {
      _and: [
        { groupId: { eq: $groupId } }
        {
          user: {
            _or: [
              { username: { contains: $search } }
              { email: { contains: $search } }
              { phone: { contains: $search } }
            ]
          }
        }
      ]
    }
  ) {
    user {
      id
      username
      email
      phone
      totalMissing
      totalDebt
    }
  }
}

query SearchUsersByUsername($search: String!) @auth(level: USER) {
  users(
    where: { username: { contains: $search } }
    orderBy: [{ username: ASC }]
    limit: 10
  ) {
    id
    username
    phone
    email
  }
}

query GetCurrentGroups @auth(level: USER) {
  groupUsers(where: { user: { id: { eq_expr: "auth.uid" } } }) {
    group {
      id
      name
      creator {
        id
        username
      }
    }
  }
}

query GetExpensesInGroup($groupId: UUID!) @auth(level: USER) {
  expenses (where: { group: { id: { eq: $groupId } }}) {
      id
      group {
        id
        name
        creator {
          id
          username
        }
      }
      userId
      name
      amount
    }
  }

query GetCurrentUserSharesInGroup($groupId: UUID!) @auth(level: USER) {
  expenses (where: { group: { id: { eq: $groupId } }}) {
    id
    group {
      id
      name
      creator {
        id
        username
      }
    }
    userId
    name
    amount
  }
}

query GetGroupById($groupId: UUID!) @auth(level: USER, insecureReason: "Authenticated users can view details groups") {
  group(key: { id: $groupId }) {
    id
    name
    creator {
      id
      username
    }
  }
}

query GetUserExpenseShareInGroup($groupId: UUID!) @auth(level: USER) {
  expenseProviders(
    where: {
      user: { id: { eq_expr: "auth.uid" } },
      expense: { groupId: { eq: $groupId } }
    }
  ) {
    shareAmount
    expense {
      id
      name
      amount
    }
  }
}
