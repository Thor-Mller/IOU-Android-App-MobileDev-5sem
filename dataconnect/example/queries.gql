# 1. Get the logged-in user's profile, expenses they paid for, and debts they owe
query GetMyProfileAndExpenses @auth(level: PUBLIC) {
  user(key: { id_expr: "auth.uid" }) {
    id
    username
    phone
    totalMissing
    totalDebt

    # Expenses THIS user created (money owed TO them)
    expenses_on_user {
      id
      name
      amount
      expenseProviders_on_expense {
        shareAmount
        user {
          id
          username
        }
      }
    }

    # Expenses OTHER users created where THIS user owes a share
    expenseProviders_on_user {
      shareAmount
      expense {
        id
        name
        amount
        user {
          id
          username
        }
      }
    }
  }
}

# 2. List all users so the user can pick friends to split an expense with
query ListUsers @auth(level: PUBLIC, insecureReason: "Authenticated users can browse users to split expenses with") {
  users {
    id
    username
    phone
  }
}

# 3. Search for a user by username or phone number
query FindUser($search: String!) @auth(level: PUBLIC, insecureReason: "Authenticated users can search for users by username or phone") {
  users(
    where: {
      _or: [
        { username: { contains: $search } }
        { phone: { eq: $search } }
      ]
    }
  ) {
    id
    username
    phone
  }
}

# 4. Get full details for one specific expense
query GetExpenseById($expenseId: UUID!) @auth(level: PUBLIC, insecureReason: "Authenticated users can view details of shared expenses") {
  expense(key: { id: $expenseId }) {
    id
    name
    amount
    user {
      id
      username
    }
    expenseProviders_on_expense {
      shareAmount
      user {
        id
        username
        phone
      }
    }
  }
}