# 1. Create the current user profile upon first sign-up
mutation CreateCurrentUser(
  $username: String!
  $phone: String!
  $email: String!
) @auth(level: USER) {
  user_insert(
    data: {
      id_expr: "auth.uid"
      username: $username
      phone: $phone
      email: $email
      totalMissing: 0.0
      totalDebt: 0.0
    }
  )
}

# 2. Create an expense owned by the signed-in Firebase user
mutation CreateExpense(
  $name: String!
  $amount: Float!
) @auth(level: USER) {
  expense_insert(
    data: {
      userId_expr: "auth.uid"
      name: $name
      amount: $amount
    }
  )
}

# 3. Add a debtor to an expense (only allowed if the caller owns the expense)
mutation AddDebtorToExpense(
  $expenseId: UUID!
  $debtorUserId: String!
  $shareAmount: Float!
) @auth(level: USER) @transaction {
  query @redact {
    expense(key: { id: $expenseId })
    @check(expr: "this != null && this.user.id == auth.uid", message: "Only the expense creator can add debtors") {
      user {
        id
      }
    }
  }
  expenseProvider_insert(
    data: {
      expenseId: $expenseId
      userId: $debtorUserId
      shareAmount: $shareAmount
    }
  )
}

# 4. Settle/remove a debtor's share (only allowed if the caller owns the expense)
mutation SettleUserShare(
  $expenseId: UUID!
  $debtorUserId: String!
) @auth(level: USER) @transaction {
  query @redact {
    expense(key: { id: $expenseId })
    @check(expr: "this != null && this.user.id == auth.uid", message: "Only the expense creator can settle shares") {
      user {
        id
      }
    }
  }
  expenseProvider_delete(
    key: {
      expenseId: $expenseId
      userId: $debtorUserId
    }
  )
}

# 5. Delete an expense (only allowed if the caller owns the expense)
mutation DeleteExpense(
  $expenseId: UUID!
) @auth(level: USER) @transaction {
  query @redact {
    expense(key: { id: $expenseId })
    @check(expr: "this != null && this.user.id == auth.uid", message: "Only the expense creator can delete this expense") {
      user {
        id
      }
    }
  }
  expense_delete(key: { id: $expenseId })
}